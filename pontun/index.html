<!doctype html>
<!-- Pöntunarsíða viðskiptavinar (Atrium 2.56.0, pantanir2.js). Slóð: pontun/?o=<uppsetning>&t=<auðkenni>.
     Les eitt skjal, opinber/{t}, úr Firebase-verkefni uppsetningarinnar (ORG.firebase í <uppsetning>/fyrirtaeki.js) án innskráningar.
     Viðskiptavinurinn getur staðfest pöntunina einu sinni með nafni og undirskrift (Firestore-reglur leyfa ekkert annað).
     ?demo: les og skrifar localStorage í stað Firebase (sýniútgáfa).
     2.67.0: líka aukaverk (teg: "aukaverk"). 2.61.0: sama síða sýnir tilboð (teg: "tilbod") – viðskiptavinurinn samþykkir það með nafni og undirskrift; starfsmaður staðfestir í appinu. -->
<html lang="is">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="light">
<title>Pöntun</title>
<link rel="icon" href="../icons/atrium-favicon.svg">
<style>
@font-face{font-family:Poppins;src:url(../fonts/Poppins-Light.ttf);font-weight:300}
@font-face{font-family:Poppins;src:url(../fonts/Poppins-Regular.ttf);font-weight:400}
@font-face{font-family:Poppins;src:url(../fonts/Poppins-Medium.ttf);font-weight:500}
:root{--bg:#F2F4F6;--surface:#FFFFFF;--ink:#0F1720;--ink2:#3A4553;--muted:#6B7684;--line:#E3E7EB;--line2:#D2D8DE;--acc:#24578A;--acc-s:#EAF0F6;--on-acc:#fff;--grn:#2C7A57;--grn-s:#E5F3EC;--amb:#9C6410;--amb-s:#FBF1E0;--red:#B13E36;color-scheme:light only}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 14px/1.5 Poppins,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding:24px 16px 64px}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px}
.top img{height:34px;max-width:220px;object-fit:contain}
.top .co{font-size:12.5px;color:var(--muted);text-align:right}
.kick{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
h1{margin:2px 0 4px;font-weight:300;font-size:28px;letter-spacing:-.02em}
.sub{color:var(--muted);font-size:13px}
.st{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500}.st::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;margin-top:16px}
.ch{padding:10px 14px;border-bottom:1px solid var(--line);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:500}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.kv div{padding:12px 14px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.kv small{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.kv b{font-weight:500;font-size:15px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-weight:500;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:8px 14px;border-bottom:1px solid var(--line)}
td{padding:9px 14px;border-bottom:1px solid var(--line);vertical-align:top}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr:last-child td{border-bottom:0}
.tot{display:flex;flex-direction:column;align-items:flex-end;gap:2px;padding:12px 14px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted)}
.tot b{color:var(--ink);font-size:16px;font-weight:500}
.terms{padding:12px 14px;font-size:12.5px;color:var(--muted);white-space:pre-line}
form{padding:14px;display:flex;flex-direction:column;gap:12px}
label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted)}
input,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px 12px}
.sig{position:relative;border:1px dashed var(--line);border-radius:6px;background:#fff}
.sig canvas{display:block;width:100%;aspect-ratio:3/1;touch-action:none;cursor:crosshair}
.sig button{position:absolute;right:8px;top:8px;border:0;background:none;color:#2F6FB3;font:inherit;font-size:12.5px;cursor:pointer}
.sig span{position:absolute;left:12px;bottom:8px;font-size:11px;color:#9AA4AD;text-transform:uppercase;letter-spacing:.06em;pointer-events:none}
.chk{flex-direction:row;align-items:flex-start;gap:10px;color:var(--ink);font-size:13px}
.chk input{width:18px;height:18px;margin-top:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 20px;border-radius:6px;border:1px solid var(--acc);background:var(--acc);color:var(--on-acc);font:inherit;font-weight:500;font-size:15px;cursor:pointer}
.btn:disabled{opacity:.5;cursor:default}
.ok{padding:16px 14px;display:flex;gap:14px;align-items:center}
.ok img{width:150px;height:50px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:4px}
.ok b{color:var(--grn);font-weight:500}
.msg{padding:40px 16px;text-align:center;color:var(--muted)}
.err{color:var(--red);font-size:13px}
.foot{margin-top:28px;text-align:center;font-size:11.5px;color:var(--muted)}
.t-grn{color:var(--grn)}.t-amb{color:var(--amb)}.t-blu{color:var(--acc)}
@media (max-width:560px){h1{font-size:24px}.top .co{display:none}td,th{padding:8px 10px}}
.pr{padding:0 14px 14px}
.btn2{display:inline-flex;align-items:center;min-height:40px;padding:0 16px;border-radius:6px;border:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;font-size:14px;cursor:pointer}
@media print{:root{--bg:#fff;--surface:#fff;--ink:#121416;--muted:#555;--line:#ccc}body{background:#fff}.wrap{padding:0;max-width:none}.pr,.foot{display:none}.card{break-inside:avoid}.top img{filter:none!important}}
.ty{min-height:80vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:24px 8px}
.tylogo{height:34px;max-width:220px;object-fit:contain;margin-bottom:8px}
.tyck{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--grn) 14%,transparent);color:var(--grn);animation:typop .45s cubic-bezier(.2,1.4,.4,1) both}
@keyframes typop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.tyck{animation:none}}
.ty h1{font-size:28px;max-width:560px;text-wrap:balance}
.tylead{margin:0;font-size:15px;max-width:520px}.tylead b{font-weight:500}
.tysum{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));width:100%;max-width:560px;background:var(--surface);border:1px solid var(--line);border-radius:6px;text-align:left;margin-top:6px}
.tysum div{padding:12px 14px;border-right:1px solid var(--line)}.tysum div:last-child{border-right:0}
.tysum small{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}.tysum b{font-weight:500}
.tysub{margin:0;font-size:12.5px;color:var(--muted)}.tysub a{color:var(--acc)}
.tybtn{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:6px}
@media print{.ty{min-height:0}.tybtn{display:none}}
.svm{padding:10px 16px;border-bottom:1px solid #e3e8ec}.svm div{margin-top:4px;white-space:pre-wrap}.svb{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.svx{border:0;background:none;color:#8a5a12;text-decoration:underline;font:inherit;cursor:pointer;padding:8px 4px}.svok{background:#e9f5ee;color:#1e6b45;border-radius:10px;padding:10px 12px;margin-bottom:12px}
/* 2.73.0: útlit Atrium (G) – alltaf ljóst */
.mapl{color:var(--acc);text-decoration:none;border-bottom:1px solid var(--acc-s)}
.t-red{color:var(--red)}.st.t-red{background:#FBE9E7}
body{background:var(--bg);color:var(--ink)}
.card{border:0;border-radius:12px;box-shadow:0 0 0 1px var(--line),0 1px 2px rgba(15,23,32,.04);margin-top:16px;overflow:hidden}
.ch{font-size:11px;letter-spacing:.08em;padding:12px 16px}
.kv div{padding:14px 16px}.kv b{font-size:15.5px}
td{padding:10px 16px}th{padding:9px 16px}
.tot{padding:14px 16px}.tot b{font-size:18px}
.st{padding:3px 10px;border-radius:999px;background:var(--acc-s)}.st.t-grn{background:var(--grn-s)}.st.t-amb{background:var(--amb-s)}
.btn{border-radius:9px;min-height:46px;box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 1px 2px rgba(15,23,32,.18)}
.btn2{border-radius:9px;background:#fff;border-color:var(--line2)}
input,textarea{background:#F8F9FA;border-color:var(--line2);border-radius:9px}
input:focus,textarea:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-s)}
.sig{border-radius:9px;border-color:var(--line2)}.sig button{color:var(--acc)}
form{padding:16px}
.terms{padding:14px 16px}
.ok{padding:18px 16px}
.tysum{border:0;border-radius:12px;box-shadow:0 0 0 1px var(--line),0 1px 2px rgba(15,23,32,.04)}
h1{font-size:30px}
</style>
</head>
<body>
<main class="wrap" id="app"><div class="msg">Sæki…</div></main>
<script type="module">
const q = new URLSearchParams(location.search), O = (q.get("o") || "").replace(/[^a-z0-9-]/gi, ""), T = (q.get("t") || "").replace(/[^a-z0-9]/gi, ""), DEMO = q.has("demo");
const app = document.getElementById("app");
const E = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const kr = n => Math.round(+n || 0).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".") + " kr.";
const DN = ["sunnudagur", "mánudagur", "þriðjudagur", "miðvikudagur", "fimmtudagur", "föstudagur", "laugardagur"], MN = ["janúar", "febrúar", "mars", "apríl", "maí", "júní", "júlí", "ágúst", "september", "október", "nóvember", "desember"];
const dl = s => { if (!s) return "–"; const x = new Date(String(s).slice(0, 10) + "T00:00:00"); return DN[x.getDay()] + " " + x.getDate() + ". " + MN[x.getMonth()]; };
const tone = s => /Staðfest|Afhent/.test(s) ? "t-blu" : /Skilað|Lokið/.test(s) ? "t-grn" : "t-amb";
const fail = m => { app.innerHTML = `<div class="msg">${E(m)}</div>`; };
if (!O || !T) fail("Tengillinn er ekki réttur. Hafðu samband við þann sem sendi hann.");
else start().catch(e => fail("Ekki tókst að sækja skjalið. " + (e?.code === "permission-denied" ? "Tengillinn er ekki lengur virkur." : "Reyndu aftur síðar.")));

const OPS = {};
async function start() {
  await new Promise((ok, no) => { const s = document.createElement("script"); s.src = "../" + O + "/fyrirtaeki.js"; s.onload = ok; s.onerror = () => no(new Error("uppsetning")); document.head.append(s); });
  let read, confirm;
  if (DEMO) {
    const k = "atrium-opinber:" + T;
    read = async () => JSON.parse(localStorage.getItem(k) || "null");
    confirm = async st => { const d = JSON.parse(localStorage.getItem(k) || "null"); if (!d || d.stadfest) throw new Error("þegar staðfest"); d.stadfest = st; d.uppfaert = new Date().toISOString(); localStorage.setItem(k, JSON.stringify(d)); };
    const put = f => { const d = JSON.parse(localStorage.getItem(k) || "null"); if (!d || d.stadfest) throw new Error("lokað"); f(d); d.uppfaert = new Date().toISOString(); localStorage.setItem(k, JSON.stringify(d)); };
    OPS.reply = async m => put(d => { d.svor = [...(d.svor || []), m]; }); OPS.reject = async h => put(d => { if (d.hafnad) throw new Error("þegar hafnað"); d.hafnad = h; });
  } else {
    const [{ initializeApp }, F] = await Promise.all([import("https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js"), import("https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore.js")]);
    const fs = F.getFirestore(initializeApp(window.ORG.firebase)), ref = F.doc(fs, "opinber", T);
    read = async () => { const s = await F.getDoc(ref); return s.exists() ? s.data() : null; };
    confirm = st => F.updateDoc(ref, { stadfest: st, uppfaert: new Date().toISOString() });
    OPS.reply = m => F.updateDoc(ref, { svor: F.arrayUnion(m), uppfaert: new Date().toISOString() });
    OPS.reject = h => F.updateDoc(ref, { hafnad: h, uppfaert: new Date().toISOString() });
  }
  const d = await read(); if (!d) return fail("Skjalið fannst ekki eða tengillinn er ekki lengur virkur. Hafðu samband við þann sem sendi hann.");
  draw(d, confirm, read);
}
function draw(d, confirm, read) {
  if (d.teg === "tilbod") return drawQ(d, confirm, read);
  if (d.teg === "aukaverk") return drawA(d, confirm, read);
  const c = d.fyrirtaeki || {}; document.title = "Pöntun " + d.nr + " · " + (c.nafn || "");
  const showPrice = d.samtals && (d.linur || []).some(l => l.upph);
  const afh = d.afhending === "sent" ? "Sent" + (d.afhStadur ? " · " + d.afhStadur : "") : d.afhending === "sott" ? "Sótt" : "–";
  const st = d.stadfest;
  app.innerHTML = `
    <div class="top"><img src="../${E(c.merki || "icons/doc-logo.png")}" alt="${E(c.nafn || "")}" onerror="this.replaceWith(Object.assign(document.createElement('b'),{textContent:${JSON.stringify(c.nafn || "")}}))"><div class="co">${E([c.simi, c.netfang].filter(Boolean).join(" · "))}</div></div>
    <div class="kick">Pöntun ${E(d.nr)}</div><h1>${E(d.heiti || "Pöntun")}</h1>
    <div class="sub">${E([d.vidskiptavinur, d.tengilidur].filter(Boolean).join(" · "))} &nbsp; <span class="st ${tone(st ? "Staðfest" : d.stada)}">${E(st && d.stada === "Ný" ? "Staðfest" : d.stada || "")}</span></div>
    <section class="card"><div class="kv"><div><small>Afhending</small><b>${E(dl(d.fra))}${d.afhKl ? " kl. " + E(d.afhKl) : ""}</b></div><div><small>Skil</small><b>${E(dl(d.til))}</b></div><div><small>Sent eða sótt</small><b>${E(afh)}</b></div></div></section>
    <section class="card"><div class="ch">Pöntunin</div><table><thead><tr><th>Lína</th><th class="n">Magn</th>${d.linur?.some(l => l.dagar) ? '<th class="n">Dagar</th>' : ""}${showPrice ? '<th class="n">Upphæð</th>' : ""}</tr></thead><tbody>
      ${(d.linur || []).map(l => `<tr><td>${E(l.heiti)}</td><td class="n">${E(l.magn)}${l.ein && l.ein !== "stk." ? " " + E(l.ein) : ""}</td>${d.linur.some(x => x.dagar) ? `<td class="n">${l.dagar || ""}</td>` : ""}${showPrice ? `<td class="n">${kr(l.upph)}</td>` : ""}</tr>`).join("")}
    </tbody></table>${showPrice ? `<div class="tot">${d.samtals.afsl ? `<span>Afsláttur −${kr(d.samtals.afsl)}</span>` : ""}<span>Samtals án VSK ${kr(d.samtals.net)}</span><span>VSK ${kr(d.samtals.vsk)}</span><b>Samtals ${kr(d.samtals.tot)}</b></div>` : ""}</section>
    ${d.skilmalar ? `<section class="card"><div class="ch">Skilmálar</div><div class="terms">${E(d.skilmalar)}</div></section>` : ""}
    <section class="card" id="conf">${st ? done(st) : `<div class="ch">Staðfesta pöntun</div><form id="f" novalidate>
      <label>Nafn<input id="nm" autocomplete="name" value="${E(d.tengilidur || "")}" required></label>
      <div class="sig"><canvas id="sg" width="600" height="200" aria-label="Undirskrift – skrifaðu með fingri eða mús"></canvas><button type="button" id="clr">Hreinsa</button><span>Undirskrift</span></div>
      <label class="chk"><input type="checkbox" id="ok">${d.skilmalar ? "Ég hef lesið skilmálana og staðfesti pöntunina" : "Ég staðfesti pöntunina"}</label>
      <div class="err" id="er" role="alert"></div>
      <div><button class="btn" id="go">Staðfesta pöntun</button></div></form>`}</section>
    <div class="foot">${E(c.nafn || "")}${c.vefur ? " · " + E(c.vefur) : ""} · Atrium</div>`;
  if (st) return;
  const cv = document.getElementById("sg"), g = cv.getContext("2d"); let dr = false, any = false, last;
  g.lineWidth = 2.4; g.lineCap = "round"; g.lineJoin = "round"; g.strokeStyle = "#121416";
  const pt = e => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * cv.width / r.width, (e.clientY - r.top) * cv.height / r.height]; };
  cv.onpointerdown = e => { dr = true; last = pt(e); cv.setPointerCapture(e.pointerId); e.preventDefault(); };
  cv.onpointermove = e => { if (!dr) return; const p = pt(e); g.beginPath(); g.moveTo(...last); g.lineTo(...p); g.stroke(); last = p; any = true; };
  cv.onpointerup = cv.onpointercancel = () => { dr = false; };
  document.getElementById("clr").onclick = () => { g.clearRect(0, 0, cv.width, cv.height); any = false; };
  document.getElementById("f").onsubmit = async e => {
    e.preventDefault(); const er = document.getElementById("er"), nm = document.getElementById("nm").value.trim();
    if (nm.length < 2) return er.textContent = "Skráðu nafn."; if (!any) return er.textContent = "Undirskrift vantar."; if (!document.getElementById("ok").checked) return er.textContent = "Hakaðu við til að staðfesta.";
    const b = document.getElementById("go"); b.disabled = true; b.textContent = "Staðfesti…";
    const s = { nafn: nm, undirskrift: cv.toDataURL("image/png"), dags: new Date().toISOString() }, at = (document.getElementById("at")?.value || "").trim(); if (at) s.athugasemd = at;
    try { await confirm(s); d.stadfest = s; thanks(d, () => draw(d, confirm, read)); window.scrollTo(0, 0); }
    catch (x) { b.disabled = false; b.textContent = "Staðfesta pöntun"; er.textContent = "Tókst ekki að staðfesta. " + (x?.code === "permission-denied" ? "Pöntunin hefur þegar verið staðfest." : "Reyndu aftur."); }
  };
}
/* Aukaverk (2.67.0): vinna utan tilboðs á verkefni – viðskiptavinurinn samþykkir einu sinni með nafni og undirskrift */
function drawA(d, confirm, read) {
  const c = d.fyrirtaeki || {}, st = d.stadfest;
  document.title = "Aukaverk · " + d.nr + " · " + (c.nafn || "");
  const stt = st || d.stada === "Samþykkt" ? ["Samþykkt", "t-grn"] : d.stada === "Hafnað" ? ["Afturkallað", "t-amb"] : ["Bíður samþykkis", "t-blu"];
  const h = +d.klst ? String(Math.round(d.klst * 10) / 10).replace(".", ",") + " klst." : "";
  app.innerHTML = `
    <div class="top"><img src="../${E(c.merki || "icons/doc-logo.png")}" alt="${E(c.nafn || "")}" onerror="this.replaceWith(Object.assign(document.createElement('b'),{textContent:${JSON.stringify(c.nafn || "")}}))"><div class="co">${E([c.simi, c.netfang].filter(Boolean).join(" · "))}</div></div>
    <div class="kick">Aukaverk · ${E(d.nr)} ${E(d.verkefni || "")}</div><h1>${E(d.heiti || "Aukaverk")}</h1>
    <div class="sub">${E([d.vidskiptavinur, d.tengilidur].filter(Boolean).join(" · "))} &nbsp; <span class="st ${stt[1]}">${stt[0]}</span></div>
    <section class="card"><div class="kv">${h ? `<div><small>Vinna</small><b>${E(h)}</b></div>` : ""}<div><small>Upphæð með VSK</small><b>${+d.upphaed ? kr(Math.round(d.upphaed * (1 + (+d.vskP || 24) / 100))) : "Rukkað samkvæmt tímaskráningu"}</b></div><div><small>Verkefni</small><b>${E(d.nr)} ${E(d.verkefni || "")}</b></div></div></section>
    <section class="card"><div class="ch">Lýsing</div><div class="terms">${E(d.heiti || "")}</div></section>
    <section class="card" id="conf">${st ? `<div class="ok">${st.undirskrift ? `<img src="${st.undirskrift}" alt="Undirskrift">` : ""}<div><b>✓ Aukaverkið er samþykkt</b><div class="sub">${E(st.nafn)} · ${E(dl(st.dags))} kl. ${E(String(st.dags).slice(11, 16))}</div></div></div>` : d.stada === "Hafnað" ? `<div class="sub">Aukaverkið hefur verið afturkallað. Hafðu samband við ${E(c.nafn || "okkur")} ef spurningar vakna.</div>` : `<div class="ch">Samþykkja aukaverk</div><form id="f" novalidate>
      <label>Nafn<input id="nm" autocomplete="name" value="${E(d.tengilidur || "")}" required></label>
      <div class="sig"><canvas id="sg" width="600" height="200" aria-label="Undirskrift – skrifaðu með fingri eða mús"></canvas><button type="button" id="clr">Hreinsa</button><span>Undirskrift</span></div>
      <label>Athugasemd (valfrjálst)<textarea id="at" rows="2" maxlength="1000"></textarea></label>
      <label class="chk"><input type="checkbox" id="ok">Ég samþykki aukaverkið${+d.upphaed ? " og að það verði rukkað" : ""}</label>
      <div class="err" id="er" role="alert"></div>
      <div><button class="btn" id="go">Samþykkja aukaverk</button></div></form>`}</section>
    <div class="foot">${E(c.nafn || "")}${c.vefur ? " · " + E(c.vefur) : ""} · Atrium</div>`;
  if (st || d.stada === "Hafnað") return;
  sign(d, confirm, () => {
    app.innerHTML = `<div class="ty"><img class="tylogo" src="../${E(c.merki || "icons/doc-logo.png")}" alt="${E(c.nafn || "")}" onerror="this.remove()">
      <div class="tyck" aria-hidden="true"><svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
      <h1>Takk – aukaverkið er samþykkt</h1><p class="tylead">${E(c.nafn || "Við")} ${c.nafn ? "hefur" : "höfum"} fengið samþykkið${+d.upphaed ? " og aukaverkið bætist við reikning verkefnisins" : ""}.</p>
      <div class="tysum"><div><small>Aukaverk</small><b>${E(d.heiti || "")}</b></div>${+d.upphaed ? `<div><small>Upphæð með VSK</small><b>${kr(Math.round(d.upphaed * (1 + (+d.vskP || 24) / 100)))}</b></div>` : ""}</div>
      <div class="tybtn"><button type="button" class="btn" id="tyv">Skoða aukaverkið</button><button type="button" class="btn2" onclick="window.print()">Prenta eða vista sem PDF</button></div></div>`;
    document.getElementById("tyv").onclick = () => { drawA(d, confirm, read); window.scrollTo(0, 0); };
  }, "Samþykkja aukaverk", "Aukaverkið hefur þegar verið samþykkt.");
}
/* Tilboð (2.61.0): sama útlit; samþykkt einu sinni með nafni og undirskrift. Útrunnið tilboð er ekki hægt að samþykkja. */
function drawQ(d, confirm, read) {
  const c = d.fyrirtaeki || {}, st = d.stadfest, today = new Date().toISOString().slice(0, 10), uti = !st && d.gildir && d.gildir < today;
  document.title = "Tilboð " + d.nr + " · " + (c.nafn || "");
  const dg = (d.linur || []).some(l => l.dagar);
  const hf = !st && d.hafnad;
  const stt = st ? ["Samþykkt", "t-grn"] : d.stada === "Samþykkt" ? ["Samþykkt", "t-grn"] : hf ? ["Hafnað", "t-red"] : uti ? ["Útrunnið", "t-amb"] : ["Bíður samþykkis", "t-blu"];
  app.innerHTML = `
    <div class="top"><img src="../${E(c.merki || "icons/doc-logo.png")}" alt="${E(c.nafn || "")}" onerror="this.replaceWith(Object.assign(document.createElement('b'),{textContent:${JSON.stringify(c.nafn || "")}}))"><div class="co">${E([c.simi, c.netfang].filter(Boolean).join(" · "))}</div></div>
    <div class="kick">Tilboð ${E(d.nr)}${d.utgafa > 1 ? " · útgáfa " + E(d.utgafa) : ""}</div><h1>${E(d.heiti || "Tilboð")}</h1>
    <div class="sub">${E([d.vidskiptavinur, d.tengilidur].filter(Boolean).join(" · "))} &nbsp; <span class="st ${stt[1]}">${stt[0]}</span></div>
    <section class="card"><div class="kv">${d.fra ? `<div><small>${d.til && d.til !== d.fra ? "Frá" : "Dagsetning"}</small><b>${E(dl(d.fra))}</b></div>${d.til && d.til !== d.fra ? `<div><small>Til</small><b>${E(dl(d.til))}</b></div>` : ""}` : ""}${d.stadsetning ? `<div><small>Staðsetning</small><b><a class="mapl" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(d.stadsetning)}" target="_blank" rel="noopener">${E(d.stadsetning)}</a></b></div>` : ""}<div><small>Gildir til</small><b>${E(dl(d.gildir))}</b></div><div><small>Samtals með VSK</small><b>${kr(d.samtals?.tot)}</b></div></div></section>
    <section class="card"><div class="ch">Tilboðið</div><table><thead><tr><th>Lína</th><th class="n">Magn</th>${dg ? '<th class="n">Dagar</th>' : ""}<th class="n">Upphæð</th></tr></thead><tbody>
      ${(d.linur || []).map(l => `<tr><td>${E(l.heiti)}</td><td class="n">${E(l.magn)}${l.ein && l.ein !== "stk." ? " " + E(l.ein) : ""}</td>${dg ? `<td class="n">${l.dagar || ""}</td>` : ""}<td class="n">${kr(l.upph)}</td></tr>`).join("")}
    </tbody></table>${d.samtals ? `<div class="tot">${d.samtals.afsl ? `<span>Afsláttur −${kr(d.samtals.afsl)}</span>` : ""}<span>Samtals án VSK ${kr(d.samtals.net)}</span><span>VSK ${kr(d.samtals.vsk)}</span><b>Samtals ${kr(d.samtals.tot)}</b></div>` : ""}</section>
    ${d.athugasemd ? `<section class="card"><div class="ch">Athugasemd</div><div class="terms">${E(d.athugasemd)}</div></section>` : ""}
    ${d.skilmalar ? `<section class="card"><div class="ch">Skilmálar</div><div class="terms">${E(d.skilmalar)}</div></section>` : ""}
    <section class="card" id="conf">${st ? doneQ(st, c) : hf ? `<div class="ok"><div><b style="color:var(--amb)">Tilboðinu var hafnað</b><div class="sub">${E(hf.nafn)} · ${E(dl(hf.dags))}${hf.astaeda ? " – „" + E(hf.astaeda) + "“" : ""}</div><div class="sub">Hafðu samband við ${E(c.nafn || "okkur")} ef þú vilt fá nýtt tilboð.</div></div></div>` : uti ? `<div class="ok"><div><b style="color:var(--amb)">Tilboðið rann út ${E(dl(d.gildir))}</b><div class="sub">Hafðu samband við ${E(c.nafn || "okkur")} ef þú vilt fá það endurnýjað.</div></div></div>` : `<div class="ch">Samþykkja tilboð</div><form id="f" novalidate>
      <label>Nafn<input id="nm" autocomplete="name" value="${E(d.tengilidur || "")}" required></label>
      <div class="sig"><canvas id="sg" width="600" height="200" aria-label="Undirskrift – skrifaðu með fingri eða mús"></canvas><button type="button" id="clr">Hreinsa</button><span>Undirskrift</span></div>
      <label class="chk"><input type="checkbox" id="ok">${d.skilmalar ? "Ég hef lesið skilmálana og samþykki tilboðið" : "Ég samþykki tilboðið"}</label>
      <div class="err" id="er" role="alert"></div>
      <div><button class="btn" id="go">Samþykkja tilboð</button></div></form>`}</section>
    ${!st && !hf ? `<section class="card" id="svar"><div class="ch">Spurningar eða breytingar?</div>
      <p class="sub" style="margin:0;padding:14px 16px 6px">Svaraðu tölvupóstinum sem tilboðið kom í${c.netfang ? `, eða skrifaðu á <a href="mailto:${E(c.netfang)}?subject=${encodeURIComponent("Tilboð " + (d.nr || ""))}">${E(c.netfang)}</a>` : ""}${c.simi ? ` eða hringdu í <a href="tel:${E(String(c.simi).replace(/[^\d+]/g, ""))}">${E(c.simi)}</a>` : ""}. Þá fylgja samskiptin tilboðinu.</p>
      <div class="svb" style="padding:4px 16px 14px"><button type="button" class="svx" id="hfn">Hafna tilboðinu</button></div><div class="err" id="ser" role="alert" style="padding:0 16px"></div></section>` : ""}
    <div class="foot">${E(c.nafn || "")}${c.vefur ? " · " + E(c.vefur) : ""} · Atrium</div>`;
  if (!st && !hf) svar(d, () => drawQ(d, confirm, read));
  if (st || uti || hf) return;
  sign(d, confirm, () => thanksQ(d, () => drawQ(d, confirm, read)), "Samþykkja tilboð", "Tilboðið hefur þegar verið samþykkt.");
}
// Spurning eða höfnun af tilboðssíðunni (2.72.0) – starfsfólk fær tilkynningu og sér svarið á tilboðinu
function svar(d, redraw) { // 2.86.0: spurningar fara í pósti – hér er aðeins hægt að hafna
  const er = document.getElementById("ser"), nmf = () => (document.getElementById("nm")?.value || d.tengilidur || "").trim();
  document.getElementById("hfn").onclick = async () => { if (nmf().length < 2) { er.textContent = "Skráðu nafn þitt í reitinn hér fyrir ofan áður en þú hafnar."; document.getElementById("nm")?.focus(); return; }
    if (!confirm("Hafna tilboði " + d.nr + "?")) return; const h = { nafn: nmf(), dags: new Date().toISOString() }, t = (prompt("Ástæða (valfrjálst):") || "").trim(); if (t) h.astaeda = t;
    try { await OPS.reject(h); d.hafnad = h; redraw(); window.scrollTo(0, 0); } catch (x) { er.textContent = "Tókst ekki. Reyndu aftur."; } };
}
function thanksQ(d, back) {
  const c = d.fyrirtaeki || {}, s = d.stadfest || {};
  app.innerHTML = `<div class="ty">
    <img class="tylogo" src="../${E(c.merki || "icons/doc-logo.png")}" alt="${E(c.nafn || "")}" onerror="this.remove()">
    <div class="tyck" aria-hidden="true"><svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
    <h1>Takk – tilboð ${E(d.nr)} er samþykkt</h1>
    <p class="tylead">${E(c.nafn || "Við")} ${c.nafn ? "fer" : "förum"} yfir samþykkið og ${c.nafn ? "hefur" : "höfum"} samband til að staðfesta${d.netfangM ? " á <b>" + E(d.netfangM) + "</b>" : ""}.</p>
    <div class="tysum"><div><small>Samtals með VSK</small><b>${kr(d.samtals?.tot)}</b></div>${d.fra ? `<div><small>Dagsetning</small><b>${E(dl(d.fra))}</b></div>` : ""}</div>
    <p class="tysub">Samþykkt af ${E(s.nafn || "")} · ${E(dl(s.dags))} kl. ${E(String(s.dags || "").slice(11, 16))}</p>
    <div class="tybtn"><button type="button" class="btn" id="tyv">Skoða tilboðið</button><button type="button" class="btn2" onclick="window.print()">Prenta eða vista sem PDF</button></div>
    ${c.simi || c.netfang ? `<p class="tysub">Spurningar? ${[c.simi && `<a href="tel:${E(String(c.simi).replace(/[^\d+]/g, ""))}">${E(c.simi)}</a>`, c.netfang && `<a href="mailto:${E(c.netfang)}">${E(c.netfang)}</a>`].filter(Boolean).join(" · ")}</p>` : ""}
  </div>`;
  document.getElementById("tyv").onclick = () => { back(); window.scrollTo(0, 0); };
}
function doneQ(s, c) { return `<div class="ok">${s.undirskrift ? `<img src="${s.undirskrift}" alt="Undirskrift">` : ""}<div><b>✓ Tilboðið er samþykkt</b><div class="sub">${E(s.nafn)} · ${E(dl(s.dags))} kl. ${E(String(s.dags).slice(11, 16))}</div>${s.athugasemd ? `<div class="sub">„${E(s.athugasemd)}“</div>` : ""}<div class="sub">${E(c.nafn || "Við")} staðfest${c.nafn ? "ir" : "um"} og ${c.nafn ? "hefur" : "höfum"} samband.</div></div></div><div class="pr"><button type="button" class="btn2" onclick="window.print()">Prenta eða vista sem PDF</button></div>`; }
// Undirskrift og innsending – sameiginlegt fyrir pöntun og tilboð
function sign(d, confirm, after, label, twice) {
  const cv = document.getElementById("sg"), g = cv.getContext("2d"); let dr = false, any = false, last;
  g.lineWidth = 2.4; g.lineCap = "round"; g.lineJoin = "round"; g.strokeStyle = "#121416";
  const pt = e => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * cv.width / r.width, (e.clientY - r.top) * cv.height / r.height]; };
  cv.onpointerdown = e => { dr = true; last = pt(e); cv.setPointerCapture(e.pointerId); e.preventDefault(); };
  cv.onpointermove = e => { if (!dr) return; const p = pt(e); g.beginPath(); g.moveTo(...last); g.lineTo(...p); g.stroke(); last = p; any = true; };
  cv.onpointerup = cv.onpointercancel = () => { dr = false; };
  document.getElementById("clr").onclick = () => { g.clearRect(0, 0, cv.width, cv.height); any = false; };
  document.getElementById("f").onsubmit = async e => {
    e.preventDefault(); const er = document.getElementById("er"), nm = document.getElementById("nm").value.trim();
    if (nm.length < 2) return er.textContent = "Skráðu nafn."; if (!any) return er.textContent = "Undirskrift vantar."; if (!document.getElementById("ok").checked) return er.textContent = "Hakaðu við til að staðfesta.";
    const b = document.getElementById("go"); b.disabled = true; b.textContent = "Augnablik…";
    const s = { nafn: nm, undirskrift: cv.toDataURL("image/png"), dags: new Date().toISOString() }, at = (document.getElementById("at")?.value || "").trim(); if (at) s.athugasemd = at;
    try { await confirm(s); d.stadfest = s; after(); window.scrollTo(0, 0); }
    catch (x) { b.disabled = false; b.textContent = label; er.textContent = "Tókst ekki. " + (x?.code === "permission-denied" ? twice : "Reyndu aftur."); }
  };
}
// Þakkarskjár eftir staðfestingu (2.57.1)
function thanks(d, back) {
  const c = d.fyrirtaeki || {}, s = d.stadfest || {}, afh = d.afhending === "sent" ? "Sent" + (d.afhStadur ? " á " + d.afhStadur : "") : d.afhending === "sott" ? "Sótt" : "";
  app.innerHTML = `<div class="ty">
    <img class="tylogo" src="../${E(c.merki || "icons/doc-logo.png")}" alt="${E(c.nafn || "")}" onerror="this.remove()">
    <div class="tyck" aria-hidden="true"><svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
    <h1>Takk fyrir að panta hjá ${E(c.nafn || "okkur")}</h1>
    <p class="tylead">Pöntun <b>${E(d.nr)}</b> er staðfest. Staðfesting verður send í tölvupósti${d.netfangM ? " á <b>" + E(d.netfangM) + "</b>" : ""}.</p>
    <div class="tysum"><div><small>Afhending</small><b>${E(dl(d.fra))}${d.afhKl ? " kl. " + E(d.afhKl) : ""}</b></div><div><small>Skil</small><b>${E(dl(d.til))}</b></div>${afh ? `<div><small>Sent eða sótt</small><b>${E(afh)}</b></div>` : ""}</div>
    <p class="tysub">Staðfest af ${E(s.nafn || "")} · ${E(dl(s.dags))} kl. ${E(String(s.dags || "").slice(11, 16))}</p>
    <div class="tybtn"><button type="button" class="btn" id="tyv">Skoða pöntunina</button><button type="button" class="btn2" onclick="window.print()">Prenta eða vista sem PDF</button></div>
    ${c.simi || c.netfang ? `<p class="tysub">Spurningar? ${[c.simi && `<a href="tel:${E(String(c.simi).replace(/[^\d+]/g, ""))}">${E(c.simi)}</a>`, c.netfang && `<a href="mailto:${E(c.netfang)}">${E(c.netfang)}</a>`].filter(Boolean).join(" · ")}</p>` : ""}
  </div>`;
  document.getElementById("tyv").onclick = () => { back(); window.scrollTo(0, 0); };
}
function done(s) { return `<div class="ok">${s.undirskrift ? `<img src="${s.undirskrift}" alt="Undirskrift">` : ""}<div><b>✓ Pöntunin er staðfest</b><div class="sub">${E(s.nafn)} · ${E(dl(s.dags))} kl. ${E(String(s.dags).slice(11, 16))}</div>${s.athugasemd ? `<div class="sub">„${E(s.athugasemd)}“</div>` : ""}<div class="sub">Staðfesting verður líka send í tölvupósti.</div></div></div><div class="pr"><button type="button" class="btn2" onclick="window.print()">Prenta eða vista sem PDF</button></div>`; }
</script>
</body>
