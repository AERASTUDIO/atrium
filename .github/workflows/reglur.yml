# Birtir aðgangsreglur Firestore (firestore.rules) sjálfkrafa þegar þeim er breytt á main.
# Lykillinn er GitHub-leyndarmálið FIREBASE_REGLUR (JSON-lykill þjónustuaðgangs með hlutverkin
# „Firebase Rules Admin“ og „Service Usage Consumer“). Lykillinn er aldrei í geymslunni sjálfri.
name: Birta Firestore-reglur

on:
  push:
    branches: [main]
    paths: [firestore.rules, firebase.json, .github/workflows/reglur.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firestore-reglur
  cancel-in-progress: false

jobs:
  birta:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LYKILL: ${{ secrets.FIREBASE_REGLUR }}
    steps:
      - name: Athuga lykil
        run: |
          if [ -z "$LYKILL" ]; then
            echo "::error::GitHub-leyndarmálið FIREBASE_REGLUR vantar (Settings › Secrets and variables › Actions)."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_REGLUR }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Birta reglur
        run: npx --yes firebase-tools@13 deploy --only firestore:rules --project aera-app-cfdb3 --non-interactive
