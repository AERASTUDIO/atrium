<!doctype html>
<!-- Vefsíða Atrium (frá 2.18.4): aðeins myndband í lykkju og „Væntanlegt“. Kynningarsíðan er geymd á kynning.html.
     Rótin er EKKI app: ekkert manifest hér, svo app-umfang uppsetninganna (aera/, sonik/, party/) skarast ekki. -->
<html lang="is"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script>/* App sem var sett upp áður en AERA flutti í aera/ (2.6.0) opnar rótina – senda það beint inn í AERA-appið */
(function(){try{if((window.matchMedia&&(matchMedia("(display-mode: standalone)").matches||matchMedia("(display-mode: window-controls-overlay)").matches||matchMedia("(display-mode: minimal-ui)").matches))||navigator.standalone===true)location.replace("aera/"+location.search+location.hash);}catch(e){}})();</script>
<title>Atrium – væntanlegt</title>
<meta name="description" content="Atrium by AERA Studio – væntanlegt.">
<meta property="og:title" content="Atrium by AERA Studio"><meta property="og:description" content="Væntanlegt."><meta property="og:image" content="vefur/atrium-vaentanlegt.jpg">
<meta name="theme-color" content="#121416">
<link rel="icon" type="image/svg+xml" href="icons/atrium-favicon.svg"><link rel="icon" type="image/png" href="icons/atrium-icon-192.png">
<style>
@font-face{font-family:P;src:url(fonts/Poppins-Light.ttf);font-weight:300;font-display:swap}
html,body{margin:0;height:100%;background:#121416;overflow:hidden}
video{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;object-fit:cover;background:#121416 url(vefur/atrium-vaentanlegt.jpg) center/cover}
h1{position:fixed;left:0;right:0;top:calc(50vh - max(3.65vw,6.48vh) + max(13.3vw,23.6vh)); /* fylgir merkinu í myndbandinu (object-fit:cover, 1920×1080, merkið í y=470) */margin:0;text-align:center;font:300 clamp(30px,5vw,64px)/1 P,system-ui,sans-serif;letter-spacing:.32em;text-indent:.32em;text-transform:uppercase;color:#DFE5EA;animation:inn 1.6s cubic-bezier(.2,.7,.2,1) .3s both}
@keyframes inn{from{opacity:0;letter-spacing:.6em;text-indent:.6em}to{opacity:1}}
@media (prefers-reduced-motion:reduce){h1{animation:none}}
</style></head><body>
<video autoplay muted loop playsinline preload="auto" poster="vefur/atrium-vaentanlegt.jpg" aria-hidden="true"><source src="vefur/atrium-vaentanlegt.mp4" type="video/mp4"></video>
<h1>Væntanlegt</h1>
<script>/* Spila ekki myndbandið hjá þeim sem biðja um minni hreyfingu – þá stendur kyrrmyndin */
try{if(matchMedia("(prefers-reduced-motion: reduce)").matches){const v=document.querySelector("video");v.removeAttribute("autoplay");v.pause();}}catch(e){}</script>
</body></html>
